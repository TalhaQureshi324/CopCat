[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copcat"
version = "0.2.0"
description = "CopCat - deterministic plagiarism audit + rubric grading for programming labs (zero AI tokens)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Talha Qureshi" }]
dependencies = ["pyyaml>=5.4", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.optional-dependencies]
web = ["uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
copcat = "copcat.cli:main"

[tool.setuptools.packages.find]
include = ["copcat*"]

[tool.setuptools.package-data]
copcat = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
