name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev,web]
      - name: Test
        run: python -m pytest tests/ -v --tb=long
      - name: Show failure details
        if: failure()
        run: |
          echo "::group::pip list"
          pip list
          echo "::endgroup::"
          echo "::group::Python version"
          python --version
          echo "::endgroup::"
